[package]
name = "cam-viewer"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.33"
if-addrs = "0.15"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
